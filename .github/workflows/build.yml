name: Build & Push Go Docker Image

on:
  push:
    tags: [ v* ]
  workflow_dispatch:
    inputs:
      debug_repo:
        description: "诊断用 OCI 仓库路径（不含 chart 名）"
        default: "helm-org"
        required: true

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Get version tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Build Go app (optional, for verification)
        run: go build -o app .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
          logout: false

      - name: Log in to DockerHub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to ACR Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASS }}

      - name: Log in to QCR Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.QCR_REGISTRY }}
          username: ${{ secrets.QCR_USER }}
          password: ${{ secrets.QCR_PASS }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/secret-cert-controller:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/secret-cert-controller:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/secret-cert-controller:${{ github.sha }}
            ghcr.io/${{ github.actor }}/secret-cert-controller:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.actor }}/secret-cert-controller:latest
            registry.cn-beijing.aliyuncs.com/osc-org/secret-cert-controller:${{ steps.get_version.outputs.VERSION }}
            registry.cn-beijing.aliyuncs.com/osc-org/secret-cert-controller:latest
            ${{ secrets.QCR_REGISTRY }}/base/secret-cert-controller:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.QCR_REGISTRY }}/base/secret-cert-controller:latest

  publish-chart:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Get version tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Align chart version with git tag
        run: |
          sed -i -E "s/^version: .*/version: ${VERSION}/" chart/Chart.yaml
          sed -i -E "s/^([[:space:]]*)tag: .*/\1tag: ${VERSION}/" chart/values.yaml
          echo "Chart.yaml version:" && grep '^version:' chart/Chart.yaml
          echo "values.yaml image.tag:" && grep -E '^\s+tag:' chart/values.yaml
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Login to QCR OCI registry
        run: helm registry login ${{ secrets.QCR_REGISTRY }} -u ${{ secrets.QCR_USER }} -p ${{ secrets.QCR_PASS }}

      - name: Login to GitHub Container Registry
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GH_TOKEN }}

      - name: Package Helm chart
        run: helm package ./chart
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Push Helm chart to QCR
        run: helm push secret-cert-controller-${VERSION}.tgz oci://${{ secrets.QCR_REGISTRY }}/helm-org
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Push Helm chart to GHCR
        run: helm push secret-cert-controller-${VERSION}.tgz oci://ghcr.io/${{ github.actor }}/helm-org
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

  diagnose-qcr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Login to QCR OCI registry
        run: |
          echo "${{ secrets.QCR_PASS }}" | helm registry login ${{ secrets.QCR_REGISTRY }} -u ${{ secrets.QCR_USER }} --password-stdin --debug

      - name: Package Helm chart
        run: helm package ./chart

      - name: Probe registry API
        run: |
          echo "=== /v2/ ==="
          curl -sS -i -u "${{ secrets.QCR_USER }}:${{ secrets.QCR_PASS }}" https://${{ secrets.QCR_REGISTRY }}/v2/ | head -20
          echo "=== tags list helm-org/secret-cert-controller ==="
          curl -sS -i -u "${{ secrets.QCR_USER }}:${{ secrets.QCR_PASS }}" \
            "https://${{ secrets.QCR_REGISTRY }}/v2/helm-org/secret-cert-controller/tags/list" | head -20

      - name: Push chart with debug
        run: |
          helm push secret-cert-controller-*.tgz oci://${{ secrets.QCR_REGISTRY }}/${{ github.event.inputs.debug_repo }} --debug
