image:
  repository: registry.cn-beijing.aliyuncs.com/osc-org/secret-cert-controller
  tag: 0.0.6
  pullPolicy: IfNotPresent

replicaCount: 1

imagePullSecrets: []
# - name: regcred

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

controller:
  # 证书中心地址
  certServer: "http://cert-server"

  # HTTP 超时（秒）
  httpTimeout: 5

  # 出站代理（留空则不使用代理）
  httpProxyUrl: ""

  configSync:
    # 同步周期（秒）：每隔多久重读配置文件并调谐一次
    syncInterval: 60

    # 配置文件在容器内的挂载目录
    mountPath: /etc/cert-sync

    # 内联同步配置：按命名空间列出域名
    # Secret 名称规则：域名中的 . 替换为 - 后追加 -tls
    #   example.com     -> example-com-tls
    #   www.example.com -> www-example-com-tls
    # 示例：
    # sync:
    #   - namespace: default
    #     domains:
    #       - example.com
    #       - www.example.com
    config: |-
      sync: []

    # 使用已有的 ConfigMap（需包含 config.yaml 键）；设置后忽略上面的内联 config，不再创建 ConfigMap
    existingConfigMap: ""
